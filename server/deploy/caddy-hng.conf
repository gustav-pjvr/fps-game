# systemd drop-in for caddy.service. setup.sh and deploy.sh install it as
# /etc/systemd/system/caddy.service.d/hng.conf.
[Service]
# HNG_DOMAIN for the Caddyfile (setup.sh writes it; not a secret).
EnvironmentFile=/etc/hng-caddy.env
# The Caddyfile puts the admin API on the unix socket /run/caddy/admin.sock. systemd creates
# /run/caddy for the caddy user at every start.
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
# `systemctl reload caddy` talks to that socket, not to the default localhost:2019.
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --force --address unix//run/caddy/admin.sock
