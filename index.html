<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #lobby, #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
      }
      #blocker {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: #eee;
        font-family: system-ui, sans-serif;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="lobby"></div>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="overlay"></div>
    <div id="blocker">Click to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
